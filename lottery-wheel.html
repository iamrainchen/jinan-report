
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金安分會 每週抽獎轉盤</title>
<style>
  :root{
    --red:#C8102E; --red-deep:#8E0B20; --gold:#E8B923; --gold-lt:#F7DC6F;
    --gold-dk:#B8860B; --ink:#3A2410; --cream:#FBF6E9; --paper:#FFFDF7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background:
      radial-gradient(circle at 50% 0%, #A50C24 0%, #8E0B20 55%, #6E0818 100%);
    color:var(--ink); min-height:100vh; padding:24px 16px 60px;
  }
  .wrap{max-width:960px;margin:0 auto}
  header{text-align:center;margin-bottom:20px}
  header h1{
    color:var(--gold-lt); font-size:30px; font-weight:700; letter-spacing:4px;
  }
  header p{color:#F3C9CF; font-size:13px; margin-top:6px; letter-spacing:1px}
  #soundToggle{
    margin-top:10px; background:rgba(232,185,35,.15); color:var(--gold-lt);
    border:1.5px solid var(--gold); border-radius:20px; padding:5px 16px;
    font-size:13px; cursor:pointer; font-family:inherit; letter-spacing:1px;
    transition:background .2s;
  }
  #soundToggle:hover{background:rgba(232,185,35,.28)}
  #soundToggle.off{opacity:.55}

  .panel{
    background:var(--paper); border-radius:16px; padding:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.35); border:2px solid var(--gold);
    margin-bottom:20px;
  }
  .panel h2{
    font-size:15px; color:var(--red-deep); margin-bottom:10px; letter-spacing:1px;
    display:flex; align-items:center; gap:8px;
  }
  .panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
  textarea{
    width:100%; height:120px; border:1.5px solid #E0D5B8; border-radius:10px;
    padding:10px 12px; font-size:12px; font-family:"Consolas",monospace;
    resize:vertical; background:var(--cream); color:var(--ink); line-height:1.5;
  }
  textarea:focus{outline:none;border-color:var(--gold-dk)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .btn{
    border:none; border-radius:10px; padding:11px 22px; font-size:15px;
    font-weight:700; cursor:pointer; font-family:inherit; letter-spacing:1px;
    transition:transform .1s, box-shadow .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{
    background:linear-gradient(180deg,var(--red) 0%,var(--red-deep) 100%);
    color:var(--gold-lt); box-shadow:0 3px 0 #5E0713;
  }
  .btn-gold{
    background:linear-gradient(180deg,var(--gold-lt) 0%,var(--gold) 55%,var(--gold-dk) 100%);
    color:var(--ink); box-shadow:0 3px 0 #8A6608;
  }
  .btn-ghost{background:transparent;border:1.5px solid #D8C89E;color:var(--red-deep);font-weight:500}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  select{
    padding:9px 12px;border:1.5px solid #E0D5B8;border-radius:9px;font-size:14px;
    background:var(--cream);font-family:inherit;color:var(--ink);cursor:pointer;
  }
  .hint{font-size:12px;color:#9A8A6A;margin-top:8px;line-height:1.6}

  .stage{display:flex;flex-direction:column;gap:20px;align-items:center}

  .wheel-box{
    position:relative; display:flex;flex-direction:column;align-items:center;
    width:100%;
  }
  .canvas-hold{position:relative;width:100%;max-width:600px;aspect-ratio:1}
  canvas#wheel{width:100%;height:100%;display:block}
  /* pointer at top */
  .pointer{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    transform-origin:50% 0;
    width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;
    border-top:30px solid var(--red);z-index:6;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));
  }
  .pointer::after{
    content:"";position:absolute;top:-30px;left:-9px;width:18px;height:18px;
    border-radius:50%;background:var(--gold);border:2px solid var(--red-deep);
  }
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
  .spinbtn-hold{margin-top:16px}

  .side{display:flex;flex-wrap:wrap;gap:16px;width:100%;max-width:720px}
  .side>.card{flex:1;min-width:220px}
  .card{
    background:var(--paper);border-radius:16px;padding:16px;border:2px solid var(--gold);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .stat-row{display:flex;gap:10px}
  .stat{flex:1;background:var(--cream);border-radius:10px;padding:10px;text-align:center}
  .stat .n{font-size:24px;font-weight:700;color:var(--red-deep)}
  .stat .l{font-size:11px;color:#9A8A6A;margin-top:2px}
  .card h3{font-size:14px;color:var(--red-deep);margin-bottom:10px;letter-spacing:1px}
  .winners{list-style:none;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
  .winners li{
    display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#FFF6D8,#FDECC0);
    border:1px solid var(--gold);border-radius:10px;padding:8px 12px;
    animation:pop .4s ease;
  }
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .winners li .rank{
    width:22px;height:22px;border-radius:50%;background:var(--red);color:var(--gold-lt);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .winners li .nm{font-size:16px;font-weight:700;color:var(--ink)}
  .winners .empty{font-size:13px;color:#B5A788;text-align:center;padding:16px 0}
  .pool{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto}
  .chip{
    background:var(--cream);border:1px solid #E0D5B8;border-radius:20px;
    padding:4px 12px;font-size:13px;color:var(--ink);
  }
  .chip.two{background:#FDECC0;border-color:var(--gold);font-weight:700}
  .toast{
    position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-80px);
    background:var(--red-deep);color:var(--gold-lt);padding:12px 24px;border-radius:30px;
    font-weight:700;font-size:15px;border:2px solid var(--gold);opacity:0;
    transition:transform .3s,opacity .3s;z-index:50;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* winner modal */
  .modal{
    position:fixed;inset:0;background:rgba(60,10,20,.75);display:none;
    align-items:center;justify-content:center;z-index:40;padding:20px;
  }
  .modal.show{display:flex}
  .modal-card{
    background:radial-gradient(circle at 50% 30%,#FFFBEF,#FBEFC9);
    border:3px solid var(--gold);border-radius:24px;padding:36px 48px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.2,1.4,.5,1);max-width:90%;
  }
  .modal-card .lbl{font-size:15px;color:var(--red);letter-spacing:6px;font-weight:700}
  .modal-card .win-name{
    font-size:52px;font-weight:700;color:var(--red-deep);margin:14px 0;letter-spacing:4px;
  }
  .modal-card .ingot{font-size:44px;margin-bottom:6px}
  .modal-card .ingot-mini{width:150px;height:112px;margin:0 auto 4px;display:block}
  .modal-card .btn{margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>金安分會 · 每週抽獎</h1>
    <p>自動同步 Google 試算表 · 轉出好運</p>
    <button id="soundToggle" title="音效開關">🔊 音效開</button>
  </header>

  <div class="panel" id="loadPanel">
    <h2><span class="dot"></span><span id="loadTitle">正在載入本週抽獎名單…</span></h2>
    <div class="row" id="loadRow">
      <span id="loadInfo" class="hint" style="margin:0">連線 Google 試算表中，請稍候</span>
      <button class="btn btn-ghost" id="reloadBtn" style="display:none">重新整理</button>
    </div>
    <p class="hint">規則：排除代理人 · 引薦每 2 次 = 1 抽（可累積）· 培訓有 = 1 抽 · 來賓有 = 1 抽。抽 2 次以上的人在轉盤上佔 2 格。</p>
  </div>

  <div class="stage">
    <div class="wheel-box">
      <div class="canvas-hold">
        <div class="pointer"></div>
        <canvas id="wheel" width="1200" height="1200"></canvas>
        <canvas id="fx" width="1200" height="1200"></canvas>
      </div>
      <div class="spinbtn-hold">
        <button class="btn btn-gold" id="spinBtn" disabled>開始抽獎</button>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="stat-row">
          <div class="stat"><div class="n" id="poolN">0</div><div class="l">轉盤格數</div></div>
          <div class="stat"><div class="n" id="peopleN">0</div><div class="l">尚未中獎</div></div>
        </div>
      </div>
      <div class="card">
        <h3>🏆 中獎名單</h3>
        <ul class="winners" id="winList"><li class="empty">還沒有人中獎</li></ul>
        <div class="row" style="margin-top:12px">
          <button class="btn btn-ghost" id="resetWin" style="flex:1">清空中獎</button>
        </div>
      </div>
      <div class="card">
        <h3>轉盤名單 <span id="twoNote" style="font-weight:400;color:#9A8A6A;font-size:12px"></span></h3>
        <div class="pool" id="poolList"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="modal-card">
    <canvas class="ingot-mini" id="ingotMini" width="200" height="150"></canvas>
    <div class="lbl">恭 喜 中 獎</div>
    <div class="win-name" id="modalName">—</div>
    <button class="btn btn-primary" id="modalClose">您真幸運！</button>
  </div>
</div>

/* ---------- sound engine (Web Audio, no files) ---------- */
let AC=null, soundOn=true;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume(); return AC; }
function tick(){
  if(!soundOn)return; const c=ac(), t=c.currentTime;
  const o=c.createOscillator(), g=c.createGain();
  o.type="square"; o.frequency.setValueAtTime(1400,t);
  o.frequency.exponentialRampToValueAtTime(700,t+0.03);
  g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.06);
}
let sweepNodes=null;
function winFanfare(){
  if(!soundOn)return; const c=ac(), t=c.currentTime;
  const go=c.createOscillator(), gg=c.createGain();
  go.type="triangle"; go.frequency.setValueAtTime(160,t);
  go.frequency.exponentialRampToValueAtTime(80,t+1.2);
  gg.gain.setValueAtTime(0.5,t); gg.gain.exponentialRampToValueAtTime(0.001,t+1.4);
  go.connect(gg).connect(c.destination); go.start(t); go.stop(t+1.5);
  const notes=[523,659,784,1047,1319];
  notes.forEach((f,i)=>{
    const tt=t+0.08+i*0.09;
    const o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,tt); g.gain.linearRampToValueAtTime(0.3,tt+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,tt+0.5);
    o.connect(g).connect(c.destination); o.start(tt); o.stop(tt+0.55);
  });
  for(let i=0;i<6;i++){
    const tt=t+0.3+i*0.06, f=1600+Math.random()*1400;
    const o=c.createOscillator(), g=c.createGain();
    o.type="square"; o.frequency.value=f;
    g.gain.setValueAtTime(0.08,tt); g.gain.exponentialRampToValueAtTime(0.001,tt+0.12);
    o.connect(g).connect(c.destination); o.start(tt); o.stop(tt+0.13);
  }
}

const SEG_COLORS=[
  ["#C8102E","#F7DC6F"],["#E8B923","#5E0713"],
  ["#8E0B20","#F7DC6F"],["#F4C430","#5E0713"]
];

/* ---------- parsing ---------- */
function parseData(raw){
  const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
  const weeks={}; // week -> {name -> {in,ex,tr,gu}}
  for(const line of lines){
    const c=line.split("\t");
    if(c.length<11) continue;
    const week=c[1], name=c[3], status=c[4];
    if(!week||!name||name==="姓名") continue;
    if(status!=="本人"&&status!=="代理人") continue;
    if(!weeks[week]) weeks[week]={};
    if(status==="代理人"){ if(!weeks[week][name])weeks[week][name]={in:0,ex:0,tr:0,gu:0,proxy:true}; continue;}
    const g=i=>{const v=parseInt((c[i]||"").replace(/,/g,""));return isNaN(v)?0:v;};
    if(!weeks[week][name]||weeks[week][name].proxy) weeks[week][name]={in:0,ex:0,tr:0,gu:0};
    weeks[week][name].in+=g(6); weeks[week][name].ex+=g(7);
    weeks[week][name].tr+=g(9); weeks[week][name].gu+=g(10);
  }
  return weeks;
}
function weekOrder(w){ // sort by M/D
  const m=w.match(/(\d+)\/(\d+)/); return m?(+m[1])*100+(+m[2]):0;
}
function drawsFor(d){
  if(d.proxy) return 0;
  const ref=d.in+d.ex; let n=0;
  if(ref>=2) n+=Math.floor(ref/2);
  if(d.tr>=1) n+=1;
  if(d.gu>=1) n+=1;
  return n;
}

/* ---------- build wheel data ---------- */
function buildFromWeek(weekData){
  baseDraws={}; 
  for(const [name,d] of Object.entries(weekData)){
    const n=drawsFor(d);
    if(n>=1) baseDraws[name]=Math.min(n,2)===n?n:n; // keep true count
  }
  rebuildSegments();
}
function rebuildSegments(){
  // winners removed; 抽2次 => 2 slots (cap display slots at 2 as agreed)
  segments=[];
  for(const [name,n] of Object.entries(baseDraws)){
    if(winners.includes(name)) continue;
    const slots=n>=2?2:1;
    for(let i=0;i<slots;i++) segments.push({name});
  }
  renderPool();
  drawWheel();
  $("#poolN").textContent=segments.length;
  const uniquePeople=new Set(segments.map(s=>s.name));
  $("#peopleN").textContent=uniquePeople.size;
  $("#spinBtn").disabled=segments.length===0||spinning;
}
function renderPool(){
  const pool=$("#poolList"); pool.innerHTML="";
  const seen=new Set(); let twoCount=0;
  for(const [name,n] of Object.entries(baseDraws)){
    if(winners.includes(name))continue;
    const two=n>=2;
    if(two)twoCount++;
    const chip=document.createElement("span");
    chip.className="chip"+(two?" two":"");
    chip.textContent=name+(two?" ×2":"");
    pool.appendChild(chip);
  }
  $("#twoNote").textContent=twoCount?`（${twoCount} 位抽 2 次，佔 2 格）`:"";
}

/* ---------- draw wheel ---------- */
function drawWheel(){
  wctx.clearRect(0,0,wheel.width,wheel.height);
  const N=segments.length;
  if(N===0){ drawIngot(); return; }
  const step=2*Math.PI/N;
  for(let i=0;i<N;i++){
    const a0=rotation+i*step, a1=a0+step;
    const col=SEG_COLORS[i%SEG_COLORS.length];
    wctx.beginPath(); wctx.moveTo(R,R);
    wctx.arc(R,R,R-6,a0,a1); wctx.closePath();
    wctx.fillStyle=col[0]; wctx.fill();
    wctx.strokeStyle="rgba(255,255,255,.25)"; wctx.lineWidth=2; wctx.stroke();
    // label
    wctx.save(); wctx.translate(R,R); wctx.rotate(a0+step/2);
    wctx.textAlign="right"; wctx.fillStyle=col[1];
    const fs=N>24?30:N>16?36:N>10?42:48;
    wctx.font=`700 ${fs}px "Microsoft JhengHei",sans-serif`;
    wctx.fillText(segments[i].name, R-34, 10);
    wctx.restore();
  }
  // outer ring
  wctx.beginPath(); wctx.arc(R,R,R-4,0,2*Math.PI);
  wctx.strokeStyle="#E8B923"; wctx.lineWidth=8; wctx.stroke();
  drawIngot();
}
function drawIngot(){
  const u=R*0.34;
  wctx.save(); wctx.translate(R,R);
  wctx.beginPath(); wctx.arc(0,0,u*1.45,0,2*Math.PI);
  wctx.fillStyle="#8E0B20"; wctx.fill();
  wctx.lineWidth=6; wctx.strokeStyle="#E8B923"; wctx.stroke();
  if(ingotReady){
    const maxD=u*2.35, ar=ingotImg.width/ingotImg.height;
    let iw,ih;
    if(ar>=1){ iw=maxD; ih=maxD/ar; } else { ih=maxD; iw=maxD*ar; }
    wctx.drawImage(ingotImg,-iw/2,-ih/2,iw,ih);
  }
  wctx.restore();
}

/* ---------- spin ---------- */
function spin(){
  if(spinning||segments.length===0)return;
  spinning=true; $("#spinBtn").disabled=true;
  const N=segments.length, step=2*Math.PI/N;
  const winIdx=Math.floor(Math.random()*N);
  // pointer is at top = -90deg = 1.5π. We want center of winIdx to land under pointer.
  const targetAngle = 1.5*Math.PI - (winIdx*step + step/2);
  const spins=6+Math.floor(Math.random()*3);
  const finalRot = targetAngle - (2*Math.PI*spins);
  const startRot=rotation%(2*Math.PI);
  const from=startRot;
  const delta=finalRot-from;
  const dur=5400+Math.random()*1400;                   // 整體放慢一點
  const t0=performance.now();
  const easeOut=t=>1-Math.pow(1-t,3.2);                // 圓盤平順減速停定
  let lastSeg=-1;
  // 指針撥片彈動的物理狀態 —— 每輪隨機化，讓彈法都不一樣
  pflap=0; pvel=0;
  pSpring = 0.17 + Math.random()*0.12;                 // 彈簧軟硬 0.17~0.29
  pDamp   = 0.72 + Math.random()*0.13;                 // 阻尼 0.72~0.85
  pKick   = 3.4  + Math.random()*2.0;                  // 基礎撥動力道 3.4~5.4
  function frame(now){
    let p=(now-t0)/dur; if(p>1)p=1;
    rotation=from+delta*easeOut(p);
    // 每經過一格：播放跳格聲 + 撥動指針
    const under=((1.5*Math.PI - rotation) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
    const segNow=Math.floor(under/step);
    if(segNow!==lastSeg){
      tick();
      // 每一下力道各自浮動 ±25%，偶爾帶點反向小抖動
      let kick = pKick*(0.78+Math.random()*0.5);
      if(Math.random()<0.15) kick *= 1.25;             // 偶爾特別大力一下
      pvel -= kick;
      if(Math.random()<0.12) pvel += (Math.random()-0.5)*2; // 小雜訊
      lastSeg=segNow;
    }
    stepPointer();
    drawWheel();
    if(p<1) requestAnimationFrame(frame);
    else settlePointerThen(()=>finishSpin(segments[winIdx].name));
  }
  requestAnimationFrame(frame);
}
/* ---------- 指針撥片彈動 ---------- */
let pflap=0, pvel=0, pSpring=0.22, pDamp=0.78, pKick=4.2;
const pointerEl=document.querySelector(".pointer");
function stepPointer(){
  // 彈簧回正 + 阻尼（參數每輪隨機）
  pvel += (0-pflap)*pSpring;
  pvel *= pDamp;
  pflap += pvel;
  if(pflap>24)pflap=24; if(pflap<-24)pflap=-24;
  if(pointerEl) pointerEl.style.transform=`translateX(-50%) rotate(${pflap.toFixed(2)}deg)`;
}
function settlePointerThen(cb){
  // 轉盤停了，讓指針把剩餘的彈動盪完再收尾
  function s(){
    stepPointer();
    if(Math.abs(pflap)>0.3||Math.abs(pvel)>0.3) requestAnimationFrame(s);
    else{ pflap=0;pvel=0; if(pointerEl)pointerEl.style.transform="translateX(-50%) rotate(0deg)"; cb&&cb(); }
  }
  requestAnimationFrame(s);
}
function finishSpin(name){
  spinning=false;
  winFanfare();
  burst();
  setTimeout(()=>{
    $("#modalName").textContent=name;
    drawMiniIngot();
    $("#modal").classList.add("show");
  },500);
}
function drawMiniIngot(){
  const cv=$("#ingotMini"); if(!cv)return;
  const x=cv.getContext("2d"); x.clearRect(0,0,200,150);
  if(ingotReady){
    const iw=150, ih=iw*ingotImg.height/ingotImg.width;
    x.drawImage(ingotImg,(200-iw)/2,(150-ih)/2,iw,ih);
  }
}
function confirmWin(){
  const name=$("#modalName").textContent;
  if(name&&name!=="—"&&!winners.includes(name)){
    winners.push(name);
    renderWinners();
    rebuildSegments();
  }
  $("#modal").classList.remove("show");
}

/* ---------- winners list ---------- */
function renderWinners(){
  const ul=$("#winList");
  if(winners.length===0){ ul.innerHTML='<li class="empty">還沒有人中獎</li>'; return; }
  ul.innerHTML="";
  winners.forEach((n,i)=>{
    const li=document.createElement("li");
    li.innerHTML=`<span class="rank">${i+1}</span><span class="nm">${n}</span>`;
    ul.appendChild(li);
  });
}

/* ---------- 元寶 burst particles ---------- */
let particles=[];
function burst(){
  particles=[];
  const cx=fx.width/2, cy=fx.height/2;
  for(let i=0;i<70;i++){
    const a=Math.random()*2*Math.PI, sp=6+Math.random()*14;
    particles.push({
      x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,
      r:10+Math.random()*14,rot:Math.random()*6,vr:(Math.random()-.5)*.4,
      life:1,type:Math.random()<.5?"ingot":"coin"
    });
  }
  animateFx();
}
function animateFx(){
  fctx.clearRect(0,0,fx.width,fx.height);
  let alive=false;
  for(const p of particles){
    if(p.life<=0)continue; alive=true;
    p.vy+=0.45; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=0.012;
    fctx.save(); fctx.globalAlpha=Math.max(p.life,0); 
    fctx.translate(p.x,p.y); fctx.rotate(p.rot);
    if(p.type==="coin"){
      fctx.beginPath();fctx.arc(0,0,p.r,0,2*Math.PI);
      fctx.fillStyle="#F4C430";fctx.fill();
      fctx.lineWidth=3;fctx.strokeStyle="#B8860B";fctx.stroke();
      fctx.fillStyle="#B8860B";fctx.fillRect(-p.r*.28,-p.r*.28,p.r*.56,p.r*.56);
    }else{
      if(ingotReady){
        const iw=p.r*2.6, ih=iw*ingotImg.height/ingotImg.width;
        fctx.drawImage(ingotImg,-iw/2,-ih/2,iw,ih);
      }else{
        fctx.beginPath();fctx.arc(0,0,p.r,0,2*Math.PI);
        fctx.fillStyle="#F1CB4A";fctx.fill();
      }
    }
    fctx.restore();
  }
  if(alive) requestAnimationFrame(animateFx);
  else fctx.clearRect(0,0,fx.width,fx.height);
}

/* ---------- toast ---------- */
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- events ---------- */
// ⬇⬇⬇ 部署 Apps Script 後，把網址貼在這裡 ⬇⬇⬇
const API_URL="https://script.google.com/macros/s/AKfycbzP_un0JdTvufKQ86kv69HzUt3A0FZCAuvzJFCu-5yp1Thohrkhr6_qdYinMNLWtKrI/exec";

// 從 API 回傳的 detail（name+draws）建立轉盤資料
function buildFromDetail(detail){
  baseDraws={};
  detail.forEach(d=>{ if(d.draws>=1) baseDraws[d.name]=d.draws; });
  rebuildSegments();
}

async function loadFromCloud(){
  const title=$("#loadTitle"), info=$("#loadInfo"), rbtn=$("#reloadBtn");
  title.textContent="正在載入本週抽獎名單…";
  info.textContent="連線 Google 試算表中，請稍候";
  rbtn.style.display="none";
  if(API_URL.indexOf("http")!==0){
    title.textContent="尚未設定資料來源";
    info.textContent="請先部署 Apps Script，並把網址填入程式的 API_URL";
    return;
  }
  try{
    const res=await fetch(API_URL,{redirect:"follow"});
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    if(!data.detail||data.detail.length===0){
      title.textContent=`${data.week||""} 本週尚無符合抽獎資格的名單`;
      info.textContent="等接龍資料齊全後按重新整理";
      rbtn.style.display="inline-block";
      baseDraws={}; winners=[]; renderWinners(); rebuildSegments();
      return;
    }
    winners=[]; renderWinners();
    buildFromDetail(data.detail);
    title.textContent=`本週抽獎：${data.week}`;
    const total=data.detail.reduce((s,x)=>s+x.draws,0);
    info.textContent=`共 ${data.detail.length} 人、${total} 抽（抽1次 ${data.one.length} 人、抽2次以上 ${data.two.length} 人）`;
    rbtn.style.display="inline-block";
    toast(`已載入 ${data.week} 抽獎名單`);
  }catch(err){
    title.textContent="載入失敗";
    info.textContent="無法連線資料來源，請確認 Apps Script 已部署為「任何人可存取」，或按重新整理再試";
    rbtn.style.display="inline-block";
  }
}

$("#reloadBtn").onclick=loadFromCloud;
$("#spinBtn").onclick=spin;
$("#modalClose").onclick=confirmWin;
$("#soundToggle").onclick=()=>{
  soundOn=!soundOn;
  const b=$("#soundToggle");
  b.textContent=soundOn?"🔊 音效開":"🔇 音效關";
  b.classList.toggle("off",!soundOn);
  if(soundOn){ac();tick();}
};
$("#resetWin").onclick=()=>{
  if(winners.length&&!confirm("確定清空中獎名單並讓所有人重新回到轉盤？"))return;
  winners=[]; renderWinners(); rebuildSegments(); toast("已重置");
};

// 開頁面自動抓最新一週
loadFromCloud();

// initial ingot
drawWheel();
</script>
